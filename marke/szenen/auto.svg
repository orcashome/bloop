<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Familie im Auto, ein Kind fragt von der Ruecksitzbank: Wie viele Zaehne hat eine Schnecke">
  <path d="M0,178 H320" stroke="var(--sz2)" stroke-width="3" stroke-linecap="round"/>
  <g stroke="var(--sz1)" stroke-width="3.4" stroke-linecap="round">
    <path d="M16,190 H52"/><path d="M84,190 H120"/><path d="M152,190 H188"/><path d="M220,190 H256"/>
  </g>
  <!-- Das Auto faehrt nach rechts. Vorher war die Silhouette in beide
       Richtungen lesbar, und damit sass das fragende Kind scheinbar vorne.
       Gespiegelt wird die ganze Karosserie, die Koepfe liegen ungespiegelt
       darueber - sonst muesste man jede Position doppelt umrechnen. -->
  <g transform="translate(320,0) scale(-1,1)">
    <path d="M40,150 C40,126 52,118 74,116 L104,84 C110,77 118,74 128,74 H206
             C218,74 228,79 234,88 L256,116 C274,120 286,130 286,150
             C286,158 280,162 272,162 H54 C46,162 40,158 40,150 Z" fill="var(--sz3)"/>
    <path d="M116,112 L134,86 C137,82 141,80 146,80 H158 V112 Z" fill="var(--paper)"/>
    <path d="M170,80 H200 C207,80 212,82 216,87 L234,112 H170 Z" fill="var(--paper)"/>
    <circle cx="92" cy="162" r="21" fill="var(--sz4)"/>
    <circle cx="92" cy="162" r="8" fill="var(--paper)"/>
    <circle cx="238" cy="162" r="21" fill="var(--sz4)"/>
    <circle cx="238" cy="162" r="8" fill="var(--paper)"/>
  </g>
  <!-- Vorne rechts faehrt jemand, hinten links sitzen zwei Kinder.
       Das fragende ist das hinterste und traegt die Akzentfarbe. -->
  <circle cx="180" cy="100" r="11" fill="var(--sz4)"/>
  <circle cx="132" cy="99" r="10" fill="var(--sz4)"/>
  <circle cx="110" cy="100" r="8" fill="var(--accent)"/>
  <!-- Blase links oben, Zipfel auf das Kind hinten. Innenabstand ausgemessen:
       die laengste Zeile ist 139 Einheiten breit, der Kasten 176 - bleiben
       gut 18 pro Seite. Vorher klebte die Zeile am Rand. -->
  <g>
    <rect x="6" y="6" width="176" height="52" rx="16" fill="var(--accent)"/>
    <path d="M92,56 L108,88 L122,58 Z" fill="var(--accent)"/>
    <text x="94" y="28" text-anchor="middle" font-size="14.5" font-weight="800"
          fill="var(--auf)" font-family="ui-rounded,system-ui,sans-serif">Wie viele Zähne</text>
    <text x="94" y="47" text-anchor="middle" font-size="14.5" font-weight="800"
          fill="var(--auf)" font-family="ui-rounded,system-ui,sans-serif">hat eine Schnecke?</text>
  </g>
</svg>
