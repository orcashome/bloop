<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Kind spricht frei vor der Klasse und sagt: Frag mich was">
  <ellipse cx="160" cy="184" rx="126" ry="13" fill="var(--sz1)"/>
  <!-- Zuhoerende, von hinten, unterschiedlich hoch -->
  <g fill="var(--sz2)">
    <circle cx="42" cy="144" r="13"/><path d="M23,186c0-13 8-24 19-24s19,11 19,24z"/>
    <circle cx="92" cy="150" r="11"/><path d="M76,186c0-11 7-20 16-20s16,9 16,20z"/>
    <circle cx="232" cy="148" r="12"/><path d="M215,186c0-12 7-21 17-21s17,9 17,21z"/>
    <circle cx="280" cy="145" r="13"/><path d="M261,186c0-13 8-24 19-24s19,11 19,24z"/>
  </g>
  <!-- Die sprechende Person, vorne. Kopf und Schultern sitzen jetzt aneinander -
       vorher klaffte dazwischen eine Luecke und der Kopf schwebte. -->
  <circle cx="160" cy="131" r="18" fill="var(--accent)"/>
  <path d="M132,186c0-20 12-34 28-34s28,14 28,34z" fill="var(--accent)"/>
  <!-- Sprechblase am Kopf statt drei abstrakter Boegen -->
  <g>
    <rect x="166" y="52" width="148" height="42" rx="15" fill="var(--accent)"/>
    <path d="M186,92 L176,124 L208,94 Z" fill="var(--accent)"/>
    <text x="240" y="79" text-anchor="middle" font-size="15" font-weight="800"
          fill="var(--auf)" font-family="ui-rounded,system-ui,sans-serif">Frag mich was.</text>
  </g>
</svg>
